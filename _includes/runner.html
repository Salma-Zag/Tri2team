<div class="js-runner" id="{{ runner1 }}">
  
<textarea id="{{ runner1 }}-editor" style="width:100%;height:200px;">
{{ include.code }}
</textarea>

<div style="margin-top:10px;">
<button onclick="runCode('{{ runner1 }}')">▶ Run</button>
<button onclick="clearOutput('{{ runner1 }}')">Clear</button>
</div>

<pre id="{{ runner1 }}-output"
style="background:#111;color:#0f0;padding:10px;margin-top:10px;height:200px;overflow:auto;"></pre>

</div>

<script>
function runCode(id){

  const editor = document.getElementById(id + "-editor");
  const output = document.getElementById(id + "-output");

  output.textContent = "";

  const log = (...args)=>{
    output.textContent += args.join(" ") + "\n";
  };

  try{

    const userCode = editor.value;

    const func = new Function("console", userCode);

    func({
      log: log
    });

  }
  catch(err){
    output.textContent += "Error: " + err.message;
  }
}

function clearOutput(id){
  document.getElementById(id + "-output").textContent = "";
}
</script>
